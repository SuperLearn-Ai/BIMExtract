# Ultra-Cost-Optimized Academic Document Extraction Pipeline Configuration

# Global Settings
pipeline:
  name: "ultra_cost_optimized_pipeline"
  version: "1.0.0"
  target_cost_per_1k_pages: 0.15
  target_accuracy: 0.95
  batch_size: 100
  max_concurrent_jobs: 4

# Stage 1: Visual Parsing Configuration
visual_parsing:
  # PaddleOCR Settings
  paddleocr:
    use_angle_cls: true
    lang: "en"
    use_gpu: true
    gpu_mem: 500
    det_model_dir: null
    rec_model_dir: null
    cls_model_dir: null
    use_space_char: true
    drop_score: 0.5
    
  # Nougat LaTeX Extraction
  nougat:
    model_name: "facebook/nougat-small"
    device: "cuda"
    batch_size: 4
    max_length: 4096
    
  # LayoutLM Document Understanding  
  layoutlm:
    model_name: "microsoft/layoutlmv3-base"
    max_seq_length: 512
    device: "cuda"
    
  # Quantization Settings
  quantization:
    enabled: true
    bits: 4
    quant_type: "nf4"
    use_double_quant: true
    compute_dtype: "bfloat16"
    
  # Processing Settings
  preprocessing:
    dpi: 150
    max_image_size: 2048
    convert_grayscale: false
    enhance_contrast: true
    
# Stage 2: Local LLM Configuration
local_llm:
  # Llama Model Settings
  model:
    path: "models/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf"
    context_length: 8192
    batch_size: 512
    threads: 8
    gpu_layers: 35
    
  # Embedding Model
  embeddings:
    model_name: "BAAI/bge-small-en-v1.5"
    device: "cpu"
    batch_size: 32
    max_seq_length: 512
    normalize_embeddings: true
    
  # Caching Strategy
  caching:
    enabled: true
    cache_type: "redis"
    cache_ttl: 86400  # 24 hours
    max_cache_size: "2GB"
    cache_hit_threshold: 0.95
    
  # Chunking Strategy
  chunking:
    strategy: "adaptive"
    base_chunk_size: 512
    overlap: 50
    min_chunk_size: 100
    max_chunk_size: 1024

# Stage 3: Vector Storage Configuration
vector_storage:
  # Qdrant Settings
  qdrant:
    host: "localhost"
    port: 6333
    collection_name: "academic_documents"
    vector_size: 384
    distance: "cosine"
    
  # Storage Optimization
  storage:
    on_disk: true
    use_quantization: true
    quantization_type: "int8"
    always_ram: false
    compression_ratio: 0.9
    
  # Indexing Settings
  indexing:
    hnsw_config:
      m: 16
      ef_construct: 200
      full_scan_threshold: 10000
      
# Stage 4: Orchestration Configuration  
orchestration:
  # Queue Settings
  queue:
    broker_url: "redis://localhost:6379/0"
    result_backend: "redis://localhost:6379/1"
    task_serializer: "json"
    result_serializer: "json"
    timezone: "UTC"
    
  # Batching Strategy
  batching:
    enabled: true
    batch_size: 100
    batch_timeout: 30
    max_batches_per_worker: 4
    
  # Complexity Routing
  routing:
    simple_threshold: 0.3
    standard_threshold: 0.7
    models:
      simple: "llama-3.1-1b-q4"
      standard: "llama-3.1-8b-q4"
      complex: "llama-3.1-70b-q4"
      
  # Auto-scaling
  scaling:
    min_workers: 2
    max_workers: 10
    scale_up_threshold: 0.8
    scale_down_threshold: 0.2
    cooldown_period: 300

# Cost Tracking
cost_tracking:
  enabled: true
  currency: "USD"
  target_costs:
    visual_parsing: 0.05
    llm_processing: 0.04
    vector_storage: 0.03
    orchestration: 0.03
    
# Performance Monitoring
monitoring:
  enabled: true
  metrics:
    - "processing_time"
    - "accuracy_score"
    - "cost_per_page"
    - "cache_hit_rate"
    - "queue_depth"
  alert_thresholds:
    cost_per_1k_pages: 0.20
    accuracy: 0.90
    processing_time: 300  # seconds

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/pipeline.log"
  max_size: "100MB"
  backup_count: 5